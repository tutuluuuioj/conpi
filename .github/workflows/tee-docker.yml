name: Reproducible TEE Container Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TEE Docker image (linux/amd64)
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./tee-service
          file: ./tee-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conpi-tee:latest
            ghcr.io/${{ github.repository_owner }}/conpi-tee:${{ github.sha }}

      - name: Output Image Digest & RTMR Info
        run: |
          echo "=========================================================="
          echo "TEE Image Built & Pushed to GHCR Successfully!"
          echo "Image: ghcr.io/${{ github.repository_owner }}/conpi-tee:latest"
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"
          echo "=========================================================="
