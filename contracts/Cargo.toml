[package]
name = "conpi-escrow"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/tutuluuuioj/conpi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["legacy", "unit-testing"] }
borsh = { version = "1.5.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
near-sdk = { version = "5.7.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
near-workspaces = "0.24.0"
tokio = { version = "1.35", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

