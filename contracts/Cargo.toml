[package]
name = "conpi-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.7.0", features = ["legacy", "unit-testing"] }
borsh = { version = "1.5.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
near-sdk = { version = "5.7.0", features = ["unit-testing"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
near-workspaces = "0.24.0"
tokio = { version = "1.35", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
