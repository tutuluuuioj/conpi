services:
  conpi-tee:
    image: ghcr.io/tutuluuuioj/conpi-tee@sha256:d4f2eca0a76a60db0af24b10d9703410191f6c161477b12ecc27b98049624468
    container_name: conpi-tee
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - conpi-meter-state:/var/lib/conpi
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CONTRACT_ID=dev-20261103062448-30583839049419.testnet
      - DAO_ID=dev-20261103021740-59711933581376.testnet
      # dRPC is primary when configured. NEAR_NODE_URL / SOLANA_RPC and the
      # built-in public endpoints remain automatic fallbacks.
      - DRPC_NEAR_URL
      - DRPC_SOLANA_URL
      - NEAR_NODE_URL
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      - TRANSIENT_RATE_LIMIT_RETRIES=2
      - TRANSIENT_RATE_LIMIT_BACKOFF_MS=250
      - UPSTREAM_FETCH_TIMEOUT_MS=300000
      - WEBSOCKET_AUTH_TIMEOUT_MS=10000
      - CHECKPOINT_INTERVAL_MS=300000
      - BILLING_QUEUE_TIMEOUT_MS=65000
      - BILLING_QUEUE_MAX_WAITERS=32
      - RELAYER_MAX_ATTEMPTS=8
      - RELAYER_RETRY_BASE_MS=1000
      - METERING_STATE_DIR=/var/lib/conpi
      - RELAYER_ACCOUNT_ID=${RELAYER_ACCOUNT_ID}
      - RELAYER_PRIVATE_KEY=${RELAYER_PRIVATE_KEY}
      - BASE_SEPOLIA_RPC
      - OPERATOR_EVM_PRIVATE_KEY
      - BASE_SEPOLIA_RELAYER_KEY
      # Public configuration for the Chain-Signatures-controlled Solana vault.
      # No wallet private key is supplied: payouts are authorized by NEAR MPC.
      - SOLANA_RPC
      - SOLANA_USDC_MINT
      - SOLANA_MPC_VAULT
      - SOLANA_MPC_PATH
      - MPC_EDDSA_DOMAIN_ID

volumes:
  conpi-meter-state:
